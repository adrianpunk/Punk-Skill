redskill-010:
  name: transparent-capability-and-boundary
  apply: "SKILL.md and submission documentation"
  level: error
  desc:
  - "The package must state a specific user-facing capability, necessary inputs, and material boundaries."
  - "It must not claim review approval, official endorsement, guaranteed outcomes, or undeclared permissions."
  tldr:
  - wrong: "A skill says it is official or 100% approved while its behavior and permissions are unclear."
    right: "A skill accurately states what it produces, what it uses, and that final review belongs to the platform."

redskill-020:
  name: no-hidden-or-account-automation-behavior
  apply: "all package files"
  level: error
  desc:
  - "The package must not automate Xiaohongshu account actions, collect credentials/Cookies, or contain hidden instructions that expand Agent behavior beyond the declared function."
  - "Potentially sensitive code, prompts, network actions, and local-data access require transparent disclosure and human review."
  tldr:
  - wrong: "A visual skill also posts a note or extracts browser data without declaring it."
    right: "The package contains only the disclosed function and blocks prohibited account automation."

redskill-030:
  name: source-and-rights-traceability
  apply: "README-REDSKILL.md and source resources"
  level: warn
  desc:
  - "The package should identify its source version and retain or add required attribution and licence information."
  - "Third-party branded styles, names, and assets need explicit rights review before inclusion."
  tldr:
  - wrong: "A copied branded preset has no provenance or permission review."
    right: "The source is traceable and included assets have a documented rights basis."
